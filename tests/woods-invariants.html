<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Woods layout checks</title>
<style>
body{margin:20px;font:14px/1.5 system-ui;background:#f6f0e4;color:#24382f}h1{font-size:22px}button,select{font:inherit;padding:8px;margin-right:8px}iframe{display:block;border:1px solid #9b9f8b;margin:20px 0;max-width:none}pre{white-space:pre-wrap;max-height:260px;overflow:auto}label{display:inline-block;margin-right:12px}
</style>
</head>
<body>
<h1>Woods layout checks</h1>
<p>Checks the 3D woods page in desktop, tablet, phone, landscape, and JavaScript-disabled frames. Run it in a visible tab on a machine with a GPU.</p>
<button id="run">Run checks</button><label>Preview <select id="size"><option value="390,844">Phone · 390 × 844</option><option value="320,740">Small phone · 320 × 740</option><option value="768,1024">Tablet · 768 × 1024</option><option value="1366,900">Desktop · 1366 × 900</option><option value="844,390">Landscape · 844 × 390</option></select></label>
<p id="steps"><button data-at="0">Trailhead</button><button data-at=".3">Into the woods</button><button data-at=".52">Bridge</button><button data-at=".8">The ridge</button><button data-at="1">Junction</button></p>
<pre id="log" role="status">Ready.</pre>
<iframe id="preview" title="Woods preview" width="390" height="844" src="../woods.html"></iframe>
<script>
const frame = document.querySelector('#preview');
const output = document.querySelector('#log');
const run = document.querySelector('#run');
const sizes = [[1366,900],[768,1024],[390,844],[320,740],[844,390]];
const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
async function until(condition, ms = 15000) {
  const started = Date.now();
  while (!condition() && Date.now() - started < ms) await pause(50);
  return condition();
}
async function load(width, height, noScript = false) {
  frame.width = width; frame.height = height;
  frame.setAttribute('sandbox', noScript ? 'allow-same-origin' : 'allow-same-origin allow-scripts');
  await new Promise((resolve, reject) => {
    const timeout = setTimeout(() => reject(new Error('Woods did not load')), 20000);
    frame.onload = () => { clearTimeout(timeout); resolve(); };
    frame.src = '../woods.html?preview=' + Date.now();
  });
  frame.scrollIntoView({behavior:'instant',block:'start'});
  if (!noScript) await until(() => /woods-(live|failed)/.test(frame.contentDocument.documentElement.className), 30000);
}
const fits = (rect, width) => rect.left >= -1 && rect.right <= width + 1;
run.addEventListener('click', async () => {
  run.disabled = true;
  output.textContent = '';
  let failures = 0, checks = 0;
  function check(condition, message) {
    checks++;
    if (!condition) failures++;
    output.textContent += `${condition ? 'PASS' : 'FAIL'} ${message}\n`;
  }
  try {
    for (const [width,height] of sizes) {
      await load(width,height);
      const win = frame.contentWindow, doc = frame.contentDocument, root = doc.documentElement, label = `${width}×${height}`;
      const viewport = root.clientWidth, links = [...doc.querySelectorAll('.woods-sign')];
      check(root.classList.contains('woods-live'), `${label}: the 3D walk starts`);
      check(root.scrollWidth <= viewport + 1, `${label}: no horizontal overflow`);
      const title = doc.querySelector('h1').getBoundingClientRect();
      check(fits(title, viewport) && title.top >= 0 && title.bottom < height, `${label}: welcome title visible`);
      const menu = doc.querySelector('.menu-btn');
      if (width <= 760) {
        menu.click();
        check(menu.getAttribute('aria-expanded') === 'true' && win.getComputedStyle(doc.querySelector('.nav')).visibility === 'visible', `${label}: menu opens`);
        doc.dispatchEvent(new KeyboardEvent('keydown', {key:'Escape',bubbles:true}));
        check(menu.getAttribute('aria-expanded') === 'false', `${label}: Escape closes menu`);
      }
      check(links.length === 4 && links.every(link => win.getComputedStyle(link).visibility === 'hidden'), `${label}: the distant signs are scenery, not tiny targets`);
      check(doc.querySelector('canvas').getAttribute('aria-hidden') === 'true', `${label}: the canvas stays out of the accessibility tree`);
      doc.querySelector('.woods-skip').click();
      await until(() => root.classList.contains('at-junction'));
      check(doc.activeElement === links[0], `${label}: the skip link lands on the first sign`);
      check(win.getComputedStyle(doc.querySelector('.woods-arrival')).visibility === 'visible' && doc.querySelector('.woods-intro').inert, `${label}: welcome gives way to the junction caption`);
      const boxes = links.map(link => link.getBoundingClientRect());
      check(boxes.every(box => fits(box, viewport) && box.top >= 0 && box.bottom <= height), `${label}: every sign is on screen`);
      check(boxes.every(box => box.height >= 36 && box.width >= 200), `${label}: every sign is large enough to tap`);
      check(boxes.every((box, i) => !i || box.top >= boxes[i - 1].top + boxes[i - 1].height * .6), `${label}: the boards stack without covering one another`);
      const caption = doc.querySelector('.woods-arrival h2').getBoundingClientRect();
      check(height < 560 || caption.bottom <= boxes[0].top + 4, `${label}: the caption sits above the signpost`);
      check(links.every(link => link.getAttribute('tabindex') !== '-1'), `${label}: destination links are keyboard accessible`);
      check(links[3].getAttribute('href') === 'about.html#contact', `${label}: connect sign leads to the contact area`);
      check(root.scrollHeight - win.innerHeight - win.scrollY <= 3, `${label}: the walk ends at the junction`);
      doc.querySelector('.woods-return').click();
      await until(() => win.scrollY < 2 && parseFloat(doc.querySelector('.woods-intro').style.opacity) > .99, 25000);
      check(win.scrollY < 2 && !doc.querySelector('.woods-intro').inert && !root.classList.contains('at-junction'), `${label}: return restores the trailhead`);
      doc.querySelector('.woods-begin').click();
      await until(() => win.scrollY > 0);
      win.dispatchEvent(new KeyboardEvent('keydown', {key:'Escape',bubbles:true}));
      const stoppedAt = win.scrollY;
      await pause(300);
      check(stoppedAt > 0 && Math.abs(win.scrollY - stoppedAt) <= 1, `${label}: user input immediately cancels the guided walk`);
    }
    await load(390,844,true);
    const doc = frame.contentDocument, win = frame.contentWindow;
    check([...doc.querySelectorAll('.nav a')].every(link => win.getComputedStyle(link).visibility === 'visible'), 'No JS: primary navigation remains visible');
    const links = [...doc.querySelectorAll('.woods-sign')];
    check(links.length === 4 && links.every(link => link.hasAttribute('href') && win.getComputedStyle(link).visibility === 'visible' && fits(link.getBoundingClientRect(), doc.documentElement.clientWidth)), 'No JS: all four signs are plain links that fit');
    const lead = doc.querySelector('.woods-lead').getBoundingClientRect();
    check(lead.bottom <= links[0].getBoundingClientRect().top, 'No JS: the welcome and the signs do not overlap');
    output.textContent += `RESULT ${failures ? 'FAIL' : 'PASS'} · ${checks-failures}/${checks} checks passed\n`;
  } catch (error) { output.textContent += `ERROR ${error.message}\n`; }
  finally { run.disabled = false; await load(390,844); }
});
document.querySelectorAll('[data-at]').forEach(button => button.addEventListener('click', () => {
  frame.src = `../woods.html?at=${button.dataset.at}&preview=${Date.now()}`;
}));
document.querySelector('#size').addEventListener('change', event => load(...event.target.value.split(',').map(Number)));
</script>
</body>
</html>
