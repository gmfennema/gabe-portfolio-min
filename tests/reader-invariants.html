<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Field-note reader invariants</title>
<style>
  body { margin: 0; padding: 16px; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  #frames { position: fixed; top: 0; left: -20000px; }
  .fail { color: #b00020; font-weight: 700; }
  .pass { color: #1b6b3a; }
  h1 { font-size: 15px; }
</style>
</head>
<body>
<h1>Field-note reader invariants</h1>
<pre id="log">running…</pre>
<div id="frames"></div>
<script>
/* Checks every field note against the promises the page makes, in a real
   browser, at real sizes. Run it with tools/check-reader.sh (or open it and
   read the list).

   The invariants:
     1. the note is set in Newsreader, in a column no wider than the measure
     2. nothing makes the page scroll sideways (code scrolls in its own box)
     3. every picture carries its size, so nothing jumps as it loads
     4. the contents lists every section, and every entry lands on its heading
        below the running head, not under it
     5. the running head names the section being read and fills as the note
        is read, all the way to the end
     6. the running head opens into the contents and closes on a choice
     7. the note knows its number and its neighbours from posts.json, and
        its reading time agrees with the one posts.json gives the index
     8. no duplicate ids

   And the Field Notes index, at the same sizes: every note listed once,
   newest first, under its own year, with its number in the series and its
   reading time; set in Newsreader; no sideways scroll.                     */

const SIZES = [
  { label: "desktop", width: 1440, height: 900 },
  { label: "laptop", width: 1280, height: 800 },
  { label: "tablet", width: 820, height: 1180 },
  { label: "phone", width: 390, height: 844 },
  { label: "small-phone", width: 375, height: 667 }
];
const MEASURE = 714; // --note-measure in site.css

const log = document.getElementById("log");
const frames = document.getElementById("frames");
const lines = [];
let failures = 0;

function record(ok, name, detail) {
  if (!ok) failures += 1;
  lines.push(`${ok ? "PASS" : "FAIL"}  ${name}${detail ? " — " + detail : ""}`);
  log.innerHTML = lines
    .map((line) => `<span class="${line.startsWith("PASS") ? "pass" : "fail"}">${line}</span>`)
    .join("\n");
}

const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
// Headless Chrome on virtual time does not reliably paint frames, so a scroll
// event may never arrive on its own: deliver one, then let the page answer.
const scrolled = async (win) => {
  win.dispatchEvent(new Event("scroll"));
  await wait(30);
};

function load(src, width, height, ready = (doc) => /No\. \d+/.test(doc.querySelector(".note-kicker")?.textContent || "")) {
  return new Promise((resolve, reject) => {
    const frame = document.createElement("iframe");
    frame.width = width;
    frame.height = height;
    frame.style.border = "0";
    frame.src = src;
    frame.addEventListener("load", () => {
      const started = Date.now();
      // Settled once posts.json has been read (a note's kicker gets its
      // number, the index its entries) and the fonts are in.
      const settle = () => {
        const doc = frame.contentDocument;
        if (doc && doc.readyState !== "loading" && ready(doc)) {
          doc.fonts.ready.then(() => setTimeout(() => resolve(frame), 120));
          return;
        }
        if (Date.now() - started > 6000) { reject(new Error("page never settled")); return; }
        setTimeout(settle, 80);
      };
      settle();
    });
    frame.addEventListener("error", () => reject(new Error("frame failed to load")));
    frames.appendChild(frame);
  });
}

async function checkPost(post, posts, size) {
  const name = `${post.path.split("/").pop().replace(".html", "")} @ ${size.label}`;
  let frame;
  try {
    frame = await load(`../${post.path}`, size.width, size.height);
  } catch (error) {
    record(false, name, error.message);
    return;
  }
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  doc.documentElement.style.scrollBehavior = "auto";
  const body = doc.querySelector(".note-body");
  const bar = doc.querySelector(".note-bar");
  const fill = doc.querySelector(".note-progress > span");

  /* 1. Type and measure */
  record(doc.fonts.check("21px Newsreader"), `${name}: Newsreader loaded`);
  const column = body.getBoundingClientRect().width;
  const viewport = doc.documentElement.clientWidth; // less any scrollbar
  record(column <= MEASURE + 0.5 && column >= Math.min(MEASURE, viewport - 44) - 0.5,
    `${name}: column on the measure`, `${Math.round(column)}px`);

  /* 2. No sideways scroll */
  const over = doc.documentElement.scrollWidth - doc.documentElement.clientWidth;
  record(over <= 0, `${name}: no sideways scroll`, `${over}px over`);

  /* 3. Sized pictures */
  const unsized = [...body.querySelectorAll("img")].filter((img) => !img.getAttribute("width") || !img.getAttribute("height"));
  record(unsized.length === 0, `${name}: pictures sized`, unsized.map((img) => img.getAttribute("src")).join(", "));

  /* 4. Contents */
  const sections = [...body.querySelectorAll(":scope > h2")];
  const headings = sections.length ? sections : [...body.querySelectorAll(":scope > h3")];
  const entries = [...doc.querySelectorAll(".note-contents a")];
  if (headings.length > 1) {
    record(entries.length === headings.length, `${name}: contents lists every section`, `${entries.length} of ${headings.length}`);
  } else {
    record(entries.length === 0, `${name}: no contents for an undivided note`, `${entries.length} entries`);
  }
  const barBottom = () => bar.getBoundingClientRect().bottom;
  for (const [index, link] of entries.entries()) {
    const target = doc.getElementById(decodeURIComponent(link.hash.slice(1)));
    if (target !== headings[index]) {
      record(false, `${name}: entry ${index + 1} lands on its heading`, `${link.hash} → ${target ? target.textContent : "nothing"}`);
      continue;
    }
    link.click();
    await scrolled(win);
    const top = target.getBoundingClientRect().top;
    // A heading near the end may not reach the top: it only has to be in view.
    const inView = top >= barBottom() - 0.5 && top < size.height;
    record(inView, `${name}: entry ${index + 1} clears the running head`, `heading at ${Math.round(top)}, head ends ${Math.round(barBottom())}`);
  }

  /* 5. Following the reader */
  win.scrollTo(0, 0);
  await scrolled(win);
  const scale = () => {
    const match = /scaleX\(([\d.]+)\)/.exec(fill.style.transform);
    return match ? Number(match[1]) : NaN;
  };
  record(scale() === 0, `${name}: progress starts empty`, fill.style.transform);
  const barName = doc.querySelector(".note-bar-name");
  if (headings.length) {
    const last = headings[headings.length - 1];
    win.scrollTo(0, win.scrollY + last.getBoundingClientRect().top - 120);
    await scrolled(win);
    const shown = barName.textContent.trim();
    // At the foot of a short note the last heading may never get near the top;
    // then the head should at least have moved on from the first section.
    const reached = last.getBoundingClientRect().top <= Math.min(size.height * 0.35, 260);
    const expected = reached ? last.textContent.trim() : null;
    record(expected ? shown === expected : shown !== headings[0].textContent.trim() || headings.length === 1,
      `${name}: running head follows`, `shows “${shown}”`);
  }
  win.scrollTo(0, doc.documentElement.scrollHeight);
  await scrolled(win);
  record(scale() === 1, `${name}: progress fills by the end`, fill.style.transform);

  /* 6. The running head opens into the contents */
  if (headings.length) {
    const summary = bar.querySelector("summary");
    const menu = bar.querySelector(".note-bar-menu");
    record(summary.getBoundingClientRect().height >= 40, `${name}: running head is a usable target`,
      `${Math.round(summary.getBoundingClientRect().height)}px tall`);
    summary.click();
    await scrolled(win);
    record(bar.open && menu.getBoundingClientRect().height > 0, `${name}: running head opens`);
    const choice = menu.querySelectorAll("a")[0];
    choice.click();
    await scrolled(win);
    record(!bar.open, `${name}: a choice closes it`);
  }

  /* 7. Place in the series */
  const sorted = [...posts].sort((a, b) => new Date(a.date) - new Date(b.date));
  const position = sorted.findIndex((entry) => entry.path === post.path);
  const kicker = doc.querySelector(".note-kicker").textContent.trim();
  record(kicker === `Field Note No. ${String(position + 1).padStart(2, "0")}`, `${name}: numbered in the series`, kicker);
  const earlier = doc.querySelector(".note-neighbour.is-earlier .note-neighbour-title")?.textContent;
  const later = doc.querySelector(".note-neighbour.is-later .note-neighbour-title")?.textContent;
  record(earlier === sorted[position - 1]?.title && later === sorted[position + 1]?.title,
    `${name}: neighbours`, `${earlier || "—"} | ${later || "—"}`);
  const meta = doc.querySelector(".note-meta").textContent;
  record(Boolean(post.minutes) && meta.includes(`${post.minutes} min read`), `${name}: reading time agrees with the index`,
    `note says “${meta.trim()}”, posts.json ${post.minutes}`);

  /* 8. Unique ids */
  const ids = [...doc.querySelectorAll("[id]")].map((node) => node.id);
  const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
  record(duplicates.length === 0, `${name}: unique ids`, duplicates.join(", "));

  frame.remove();
}

async function checkIndex(posts, size) {
  const name = `field-notes index @ ${size.label}`;
  let frame;
  try {
    frame = await load("../field-notes.html", size.width, size.height, (doc) => doc.querySelector(".notes-entry"));
  } catch (error) {
    record(false, name, error.message);
    return;
  }
  const doc = frame.contentDocument;
  const newest = [...posts].sort((a, b) => new Date(b.date) - new Date(a.date));
  const oldest = [...newest].reverse();
  const entries = [...doc.querySelectorAll(".notes-entry")];

  record(doc.fonts.check("italic 27px Newsreader"), `${name}: Newsreader loaded`);
  const over = doc.documentElement.scrollWidth - doc.documentElement.clientWidth;
  record(over <= 0, `${name}: no sideways scroll`, `${over}px over`);
  const listed = entries.map((entry) => entry.getAttribute("href"));
  record(listed.join() === newest.map((post) => post.path).join(), `${name}: every note once, newest first`,
    `${entries.length} of ${posts.length}`);

  newest.forEach((post, index) => {
    const entry = entries[index];
    if (!entry) return;
    const label = `${name}: ${post.path.split("/").pop().replace(".html", "")}`;
    const number = `No. ${String(oldest.indexOf(post) + 1).padStart(2, "0")}`;
    const shown = entry.querySelector(".notes-no")?.textContent;
    const minutes = entry.querySelector(".notes-min")?.textContent;
    const year = entry.closest(".notes-list")?.previousElementSibling?.textContent;
    record(shown === number, `${label} numbered`, shown);
    record(Boolean(post.minutes) && minutes === `${post.minutes} min`, `${label} reading time`, minutes || "none");
    record(year === post.date.slice(0, 4), `${label} under its year`, year);
  });

  frame.remove();
}

(async () => {
  const posts = await fetch("../posts/posts.json").then((response) => response.json());
  for (const size of SIZES) {
    for (const post of posts) {
      await checkPost(post, posts, size);
    }
    await checkIndex(posts, size);
  }
  lines.push("");
  lines.push(failures ? `RESULT FAIL (${failures} failing checks)` : `RESULT PASS (${lines.length - 1} checks)`);
  log.textContent = lines.join("\n");
  document.title = failures ? "FAIL" : "PASS";
})();
</script>
</body>
</html>
