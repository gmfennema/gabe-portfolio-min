<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Homepage layout checks</title>
<style>
body{margin:20px;font:14px/1.5 system-ui;background:#f6f0e4;color:#24382f}h1{font-size:22px}button,select{font:inherit;padding:8px;margin-right:8px}iframe{display:block;border:1px solid #9b9f8b;margin:20px 0;max-width:none}pre{white-space:pre-wrap;max-height:200px;overflow:auto}#preview-wrap{overflow:auto}label{display:inline-block;margin-right:12px}
</style>
</head>
<body>
<h1>Homepage layout checks</h1>
<p>Checks the real homepage in desktop, tablet, phone, short-screen, and JavaScript-disabled frames.</p>
<button id="run">Run checks</button><label>Preview <select id="size"><option value="390,844">Phone · 390 × 844</option><option value="320,740">Small phone · 320 × 740</option><option value="768,1024">Tablet · 768 × 1024</option><option value="1366,900">Desktop · 1366 × 900</option><option value="844,390">Landscape · 844 × 390</option></select></label>
<pre id="log" role="status">Ready.</pre>
<div id="preview-wrap"><iframe id="preview" title="Homepage preview" width="390" height="844" src="../index.html"></iframe></div>
<script>
const frame = document.querySelector('#preview');
const output = document.querySelector('#log');
const run = document.querySelector('#run');
const sizes = [[1366,900],[768,1024],[390,844],[320,740],[844,390]];
const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
async function until(condition) {
  const started = Date.now();
  while (!condition() && Date.now() - started < 6000) await pause(50);
}
async function load(width, height, noScript = false) {
  frame.width = width; frame.height = height;
  frame.setAttribute('sandbox', noScript ? 'allow-same-origin' : 'allow-same-origin allow-scripts');
  await new Promise((resolve, reject) => {
    const timeout = setTimeout(() => reject(new Error('Homepage did not load')), 15000);
    frame.onload = () => { clearTimeout(timeout); resolve(); };
    // A fresh preview URL avoids mixing a new test runner with stale CDN HTML.
    frame.src = '../index.html?preview=' + Date.now();
  });
  frame.scrollIntoView({behavior:'instant',block:'start'});
  await pause(150);
  frame.contentWindow.scrollTo({top:0,behavior:'instant'});
}
function fits(rect, width) { return rect.left >= -1 && rect.right <= width + 1; }
run.addEventListener('click', async () => {
  run.disabled = true;
  output.textContent = '';
  let failures = 0;
  let checks = 0;
  function check(condition, message) {
    checks++;
    if (!condition) failures++;
    output.textContent += `${condition ? 'PASS' : 'FAIL'} ${message}\n`;
  }
  try {
    for (const [width,height] of sizes) {
      await load(width,height);
      const win = frame.contentWindow, doc = frame.contentDocument;
      const label = `${width}×${height}`;
      const viewport = doc.documentElement.clientWidth;
      check(doc.documentElement.scrollWidth <= viewport + 1, `${label}: no horizontal overflow`);
      const title = doc.querySelector('h1').getBoundingClientRect();
      check(fits(title, viewport) && title.top >= 0 && title.bottom < height, `${label}: welcome title visible`);
      const menu = doc.querySelector('.menu-btn');
      if (width <= 760) {
        menu.click();
        check(menu.getAttribute('aria-expanded') === 'true' && win.getComputedStyle(doc.querySelector('.nav')).visibility === 'visible', `${label}: menu opens`);
        doc.dispatchEvent(new KeyboardEvent('keydown', {key:'Escape',bubbles:true}));
        check(menu.getAttribute('aria-expanded') === 'false', `${label}: Escape closes menu`);
      }
      const sign = doc.querySelector('.junction-sign');
      const links = [...doc.querySelectorAll('.sign-link')];
      check(doc.querySelectorAll('main > section').length === 1 && doc.querySelectorAll('.trail-scene').length === 1, `${label}: one continuous SVG scene`);
      check(links.length === 4 && links.every(link => link.closest('svg') === doc.querySelector('.trail-scene')), `${label}: all four links belong to the landscape`);
      if (doc.body.classList.contains('journey-motion')) {
        const openingWidth = sign.getBoundingClientRect().width;
        check(sign.getAttribute('aria-hidden') === 'true' && links.every(link => link.getAttribute('tabindex') === '-1'), `${label}: distant sign is not a tiny keyboard target`);
        const walk = doc.querySelector('.trail-walk');
        const distance = walk.offsetHeight - doc.querySelector('.walk-stage').offsetHeight;
        win.scrollTo({top:distance * .48,behavior:'smooth'});
        await until(() => sign.getBoundingClientRect().width > openingWidth * 1.6);
        check(sign === doc.querySelector('.junction-sign') && sign.getBoundingClientRect().width > openingWidth * 1.6, `${label}: the original sign grows during approach`);
        doc.querySelector('.junction-shortcut').click();
        await until(() => doc.body.classList.contains('at-junction') && win.scrollY >= distance - 2);
        check(sign === doc.querySelector('.junction-sign') && sign.getBoundingClientRect().width > openingWidth * 4, `${label}: same sign at the destination`);
        check(doc.querySelector('.trail-intro').inert && win.getComputedStyle(doc.querySelector('.arrival-copy')).visibility === 'visible', `${label}: welcome gives way to the junction caption`);
        check(doc.documentElement.scrollHeight - win.innerHeight - win.scrollY <= 3, `${label}: scroll ends in the scene, without another section`);
      } else {
        check(win.getComputedStyle(doc.querySelector('.walk-stage')).position !== 'sticky', `${label}: short screen uses the still composition`);
      }
      check(links.every(link => fits(link.getBoundingClientRect(), viewport)), `${label}: all signboards fit the screen width`);
      if (height > 580) check(links.every(link => {const box=link.getBoundingClientRect();return box.top >= 0 && box.bottom <= height && box.height >= 44;}), `${label}: every destination is visible and large enough to tap`);
      check(links.every(link => link.getAttribute('tabindex') !== '-1') && sign.getAttribute('aria-hidden') !== 'true', `${label}: destination links are keyboard accessible`);
      check(doc.querySelector('[data-trail="connect"]').getAttribute('href') === 'about.html#contact', `${label}: connect sign leads to the contact area`);
      if (doc.body.classList.contains('journey-motion')) {
        doc.querySelector('.trail-return').click();
        await until(() => win.scrollY < 2 && doc.querySelector('.trail-intro').style.opacity === '1.000');
        check(win.scrollY < 2 && !doc.querySelector('.trail-intro').inert, `${label}: return restores the opening view`);
      }
    }
    await load(390,844,true);
    const doc = frame.contentDocument;
    check(!doc.body.classList.contains('journey-motion'), 'No JS: still SVG composition');
    check([...doc.querySelectorAll('.nav a')].every(link => frame.contentWindow.getComputedStyle(link).visibility === 'visible'), 'No JS: primary navigation remains visible');
    const links = [...doc.querySelectorAll('.sign-link')];
    check(links.length === 4 && links.every(link => link.hasAttribute('href') && fits(link.getBoundingClientRect(),doc.documentElement.clientWidth)), 'No JS: all four SVG links are available and fit');
    output.textContent += `RESULT ${failures ? 'FAIL' : 'PASS'} · ${checks-failures}/${checks} checks passed\n`;
  } catch (error) { output.textContent += `ERROR ${error.message}\n`; }
  finally { run.disabled = false; await load(390,844); }
});
document.querySelector('#size').addEventListener('change', event => load(...event.target.value.split(',').map(Number)));
</script>
</body>
</html>
