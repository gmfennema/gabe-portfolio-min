<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 720" preserveAspectRatio="xMidYMax slice" role="img" aria-labelledby="title desc">
  <title id="title">A hand-drawn Dutch polder</title>
  <desc id="desc">A wide sky over flat farmland, a windmill on the dike beside a canal, rows of tulips in the foreground, and poplars along the horizon.</desc>
