<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">A hand-drawn high-country landscape</title>
  <desc id="desc">Layered blue mountains, dark evergreens, pale clouds, rocks, and field grass.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f1e5" stop-opacity="0"/>
      <stop offset=".55" stop-color="#dbe5e4" stop-opacity=".6"/>
      <stop offset="1" stop-color="#c7d3d2" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb4bb"/>
      <stop offset="1" stop-color="#687f81"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#85907b"/>
      <stop offset="1" stop-color="#5d674f"/>
    </linearGradient>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="13" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="fade"><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="fade" mode="multiply"/>
    </filter>
  </defs>
